
name: Recipe App CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build backend Docker image
        run: docker build -t recipe-backend ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://recipe-sharing-app-dhhk.onrender.com \
            -t recipe-frontend ./frontend

      - name: Deploy backend to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || {
            echo "Missing backend deploy hook"
            exit 1
          }
          curl --fail --show-error --silent \
            --retry 3 \
            --request POST "$DEPLOY_HOOK"

      - name: Deploy frontend to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || {
            echo "Missing frontend deploy hook"
            exit 1
          }
          curl --fail --show-error --silent \
            --retry 3 \
            --request POST "$DEPLOY_HOOK"

