
services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    volumes:
      - recipe_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  recipe_data:
